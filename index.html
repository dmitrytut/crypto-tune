<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>crypto-tune: the market, played as sound</title>
  </head>
  <body>
    <canvas id="aura" class="layer" aria-hidden="true"></canvas>
    <canvas id="fx" class="layer" aria-hidden="true"></canvas>

    <main id="stage" class="stage">
      <header class="top fades">
        <!-- Pair dropdown, built by ui/picker.ts. -->
        <div class="picker picker-chip" id="pair"></div>
        <div class="top-right">
          <span id="status" class="status" data-state="idle">idle</span>
          <button id="settings-open" class="icon-btn" type="button" aria-label="Settings">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </header>
      <section class="hero">
        <h1 class="visually-hidden" id="title">Market, played as sound</h1>
        <div class="price" id="price">—</div>
        <div class="change" id="change">&nbsp;</div>

        <div class="meter fades">
          <div class="meter-head">
            <div class="hint" id="tension-hint">
              <button type="button" class="hint-btn" id="tension-hint-btn" aria-describedby="tension-help">
                Tension
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg>
              </button>
              <div class="hint-pop" id="tension-help" role="tooltip"></div>
            </div>
            <span id="tension-value"></span>
          </div>
          <div class="meter-track" id="tension-track">
            <div class="meter-fill" id="tension-fill"></div>
          </div>
          <div class="meter-scale" id="tension-scale"></div>
        </div>

        <div class="info fades">
          <span id="vol">—</span>
          <span class="dot" aria-hidden="true">·</span>
          <span id="last-event"></span>
        </div>

        <button id="audio-toggle" class="play fades" type="button" data-state="stopped">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z" /></svg>
          <span id="audio-label">Listen</span>
        </button>
      </section>

      <canvas id="chart" class="chart" role="img"></canvas>
    </main>

    <dialog id="settings" class="settings" aria-labelledby="settings-title">
      <form method="dialog" class="settings-body">
        <header class="settings-head">
          <h2 id="settings-title">Settings</h2>
          <button class="icon-btn" type="submit" value="close" aria-label="Close">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </header>

        <h3 id="period-title">Period</h3>
        <!-- Options built from HISTORY_PERIODS_MIN by settings-panel.ts. -->
        <fieldset class="segmented" id="period" aria-labelledby="period-title"></fieldset>

        <h3>Sound</h3>
        <div class="field">
          <span>Tonic</span>
          <div class="picker picker-field" id="tonic"></div>
        </div>
        <label class="field">
          <span>Base: <output id="base-volume-out"></output> dB</span>
          <input id="base-volume" type="range" />
        </label>
        <label class="field">
          <span>Tension: <output id="tension-volume-out"></output> dB</span>
          <input id="tension-volume" type="range" />
        </label>
        <label class="field">
          <span>Events: <output id="events-volume-out"></output> dB</span>
          <input id="events-volume" type="range" />
        </label>

        <h3>Response</h3>
        <label class="field">
          <span>Price-change window: <output id="window-out"></output> s</span>
          <input id="window" type="range" />
        </label>
        <label class="field">
          <span>Sensitivity: ×<output id="sensitivity-out"></output></span>
          <input id="sensitivity" type="range" />
        </label>
        <label class="field">
          <span>Liquidation threshold: <output id="liq-threshold-out"></output></span>
          <input id="liq-threshold" type="range" />
        </label>
        <label class="field">
          <span>Large trade threshold: <output id="trade-threshold-out"></output></span>
          <input id="trade-threshold" type="range" />
        </label>

        <h3>Source</h3>
        <fieldset class="segmented">
          <legend class="visually-hidden">Data source</legend>
          <label><input type="radio" name="source" value="live" /> Live</label>
          <label><input type="radio" name="source" value="simulator" /> Simulator</label>
        </fieldset>

        <details class="debug" id="debug" hidden>
          <summary>Debug</summary>
          <dl class="stats">
            <dt>tension</dt><dd id="tension">—</dd>
            <dt>direction</dt><dd id="direction">—</dd>
            <dt>z (ret)</dt><dd id="z">—</dd>
            <dt>volZ</dt><dd id="volz">—</dd>
            <dt>vs EMA 1h</dt><dd id="emaz">—</dd>
            <dt>warm-up</dt><dd id="warmup">—</dd>
          </dl>
        </details>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
