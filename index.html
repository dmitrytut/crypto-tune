<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07060d" />
    <meta name="description" content="Hear the crypto market: live trades and liquidations from any futures pair, turned into calm generative music. Free, in the browser." />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Crypto Tune: the market, played as sound</title>
    <!-- One page: query strings (?debug, share-tracking params) must not become duplicates. -->
    <link rel="canonical" href="https://dmitrytut.github.io/crypto-tune/" />
    <!-- Link previews (Telegram, Slack, X, Discord). Crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Crypto Tune" />
    <meta property="og:title" content="Crypto Tune: the market, played as sound" />
    <meta property="og:description" content="Hear the crypto market: live trades and liquidations from any futures pair, turned into calm generative music. Free, in the browser." />
    <meta property="og:url" content="https://dmitrytut.github.io/crypto-tune/" />
    <meta property="og:image" content="https://dmitrytut.github.io/crypto-tune/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Crypto Tune logo and tagline over the app's aura" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Crypto Tune",
        "url": "https://dmitrytut.github.io/crypto-tune/",
        "description": "Hear the crypto market: live trades and liquidations from any futures pair, turned into calm generative music. Free, in the browser.",
        "image": "https://dmitrytut.github.io/crypto-tune/og.jpg",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and the Web Audio API",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "sameAs": "https://github.com/dmitrytut/crypto-tune"
      }
    </script>
  </head>
  <body>
    <canvas id="aura" class="layer" aria-hidden="true"></canvas>
    <canvas id="fx" class="layer" aria-hidden="true"></canvas>

    <main id="stage" class="stage">
      <header class="top fades">
        <!-- Pair dropdown, built by ui/components/picker. -->
        <div class="picker picker-chip" id="pair"></div>
        <div class="top-right">
          <span id="status" class="status" data-state="idle">idle</span>
          <button id="settings-open" class="icon-btn" type="button" aria-label="Settings">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </header>
      <section class="hero">
        <h1 class="visually-hidden">Crypto Tune: the market, played as sound</h1>
        <div class="price" id="price">—</div>
        <div class="change" id="change">&nbsp;</div>

        <div class="meter fades">
          <!-- The Tension label with its hint is built by ui/components/meter. -->
          <div class="meter-head">
            <span id="tension-value"></span>
          </div>
          <div class="meter-track" id="tension-track">
            <div class="meter-fill" id="tension-fill"></div>
          </div>
          <div class="meter-scale" id="tension-scale"></div>
        </div>

        <div class="info fades">
          <span id="vol">—</span>
          <span class="dot" aria-hidden="true">·</span>
          <span id="last-event"></span>
        </div>

        <button id="audio-toggle" class="play fades" type="button" data-state="stopped">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z" /></svg>
          <span id="audio-label">Listen</span>
        </button>
      </section>

      <canvas id="chart" class="chart" role="img"></canvas>
      <!-- Event marker tooltip, filled by ui/components/chart-tip. -->
      <div id="chart-tip" class="chart-tip" role="tooltip" hidden>
        <span class="chart-tip-what"></span>
        <span class="chart-tip-when"></span>
      </div>
    </main>

    <dialog id="settings" class="settings" aria-labelledby="settings-title">
      <form method="dialog" class="settings-body">
        <header class="settings-head">
          <h2 id="settings-title">Settings</h2>
          <button class="icon-btn" type="submit" value="close" aria-label="Close">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </header>

        <!-- Every setting gets an ⓘ hint from settings-panel.ts, after the label just before it. -->
        <h3 id="period-title">Period</h3>
        <!-- Options built from HISTORY_PERIODS_MIN by settings-panel.ts. -->
        <fieldset class="segmented" id="period" aria-labelledby="period-title"></fieldset>

        <h3>Sound</h3>
        <div class="field">
          <div class="field-head"><span id="tonic-label">Tonic</span></div>
          <div class="picker picker-field" id="tonic"></div>
        </div>
        <div class="field">
          <div class="field-head">
            <label for="base-volume">Base: <output id="base-volume-out"></output> dB</label>
          </div>
          <input id="base-volume" type="range" />
        </div>
        <div class="field">
          <div class="field-head">
            <label for="tension-volume">Tension: <output id="tension-volume-out"></output> dB</label>
          </div>
          <input id="tension-volume" type="range" />
        </div>
        <div class="field">
          <div class="field-head">
            <label for="events-volume">Events: <output id="events-volume-out"></output> dB</label>
          </div>
          <input id="events-volume" type="range" />
        </div>

        <h3>Response</h3>
        <div class="field">
          <div class="field-head">
            <label for="window">Price-change window: <output id="window-out"></output> s</label>
          </div>
          <input id="window" type="range" />
        </div>
        <div class="field">
          <div class="field-head">
            <label for="sensitivity">Sensitivity: ×<output id="sensitivity-out"></output></label>
          </div>
          <input id="sensitivity" type="range" />
        </div>
        <div class="field">
          <div class="field-head">
            <label for="liq-threshold">Liquidation threshold: <output id="liq-threshold-out"></output></label>
          </div>
          <input id="liq-threshold" type="range" />
        </div>
        <div class="field">
          <div class="field-head">
            <label for="trade-threshold">Large trade threshold: <output id="trade-threshold-out"></output></label>
          </div>
          <input id="trade-threshold" type="range" />
        </div>

        <h3 id="source-title">Source</h3>
        <fieldset class="segmented" id="source" aria-labelledby="source-title">
          <label><input class="visually-hidden" type="radio" name="source" value="live" /> Live</label>
          <label><input class="visually-hidden" type="radio" name="source" value="simulator" /> Simulator</label>
        </fieldset>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
